name: Tests

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Seules dépendances runtime du serveur nécessaires aux tests.
      # La suite elle-même n'ajoute aucune dépendance (unittest + node:test).
      - name: Install server deps
        run: python -m pip install aiohttp cryptography

      - name: Run test suite
        run: ./wt-rotate/run_tests.sh
