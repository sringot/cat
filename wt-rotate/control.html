<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>wt · remote</title>
<style>
*, *::before, *::after {
  box-sizing: border-box; margin: 0; padding: 0;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --black:  #0D0D0D;
  --white:  #FFFFFF;
  --bg:     #F5F5F7;
  --card:   #FFFFFF;
  --t1:     #0D0D0D;
  --t2:     #6E6E73;
  --t3:     #AEAEB2;
  --bdr:    #E8E8ED;
  --green:  #30D158;
  --gbg:    #F0FFF5;
  --red:    #FF3B30;
  --rbg:    #FFF1F0;
  --sh:     0 1px 1px rgba(0,0,0,.03), 0 4px 16px rgba(0,0,0,.06);
}

html { -webkit-font-smoothing: antialiased; }

body {
  background: var(--bg);
  color: var(--t1);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100vh;
  padding-bottom: max(32px, env(safe-area-inset-bottom));
}

/* ── HEADER ────────────────────────────────────────────── */
.nav {
  position: sticky; top: 0; z-index: 99;
  background: rgba(245,245,247,.88);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid rgba(0,0,0,.06);
  padding: 13px 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.nav-brand {
  display: flex; align-items: center; gap: 10px;
}
.brand-icon {
  width: 32px; height: 32px; background: var(--black);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
}
.brand-icon svg { width: 17px; height: 17px; }
.brand-name {
  font-size: 15px; font-weight: 700; letter-spacing: -.4px;
  color: var(--t1);
}
.brand-name span { color: var(--t2); font-weight: 500; }

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 11px; border-radius: 20px;
  font-size: 11px; font-weight: 600; letter-spacing: -.1px;
}
.pill-dot { width: 6px; height: 6px; border-radius: 50%; }
.pill.on  { background: var(--gbg); color: #1D7A3A; }
.pill.on  .pill-dot { background: var(--green); }
.pill.off { background: var(--rbg); color: var(--red); }
.pill.off .pill-dot { background: var(--red); }
.pill.wait { background: #F5F5F7; color: var(--t2); }
.pill.wait .pill-dot { background: var(--t3); }

/* ── SCREENS ────────────────────────────────────────────── */
.screen { display: none; }
.screen.show { display: flex; }

#s-load, #s-err {
  flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 72vh;
  gap: 14px; padding: 40px 28px; text-align: center;
}
.loader {
  width: 38px; height: 38px;
  border: 3px solid var(--bdr);
  border-top-color: var(--black);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.err-icon  { font-size: 48px; }
.err-title { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
.err-body  { font-size: 14px; color: var(--t2); line-height: 1.6; max-width: 300px; }

#s-main { flex-direction: column; }

/* ── LAYOUT ─────────────────────────────────────────────── */
.stack {
  display: flex; flex-direction: column; gap: 12px;
  padding: 16px 16px 0;
  max-width: 520px; margin: 0 auto;
}

/* ── CARD ───────────────────────────────────────────────── */
.card {
  background: var(--card);
  border-radius: 18px;
  box-shadow: var(--sh);
  overflow: hidden;
}
.card-p { padding: 20px; }

.sect-lbl {
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 1.4px;
  color: var(--t2); margin-bottom: 14px;
}

/* ── NOW PLAYING ────────────────────────────────────────── */
.np-top {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 12px;
  margin-bottom: 6px;
}
.np-name {
  font-size: 20px; font-weight: 800;
  letter-spacing: -.5px; line-height: 1.2;
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.np-url {
  font-size: 11px; color: var(--t2);
  font-family: 'SF Mono','Consolas','Courier New',monospace;
  margin-bottom: 14px; word-break: break-all;
  line-height: 1.5;
}
.status-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 13px; border-radius: 20px;
  font-size: 12px; font-weight: 600;
}
.sb-dot { width: 7px; height: 7px; border-radius: 50%; }
.status-badge.on  { background: var(--gbg); color: #1D7A3A; }
.status-badge.on  .sb-dot { background: var(--green); }
.status-badge.off { background: var(--rbg); color: var(--red); }
.status-badge.off .sb-dot { background: var(--red); }
.status-badge.ext { background: #FFF3E0; color: #E65100; }
.status-badge.ext .sb-dot { background: #FF9800; }

/* ── URL BAR ────────────────────────────────────────────── */
.url-bar {
  display: flex; align-items: stretch;
  background: #F5F5F7; border-radius: 14px;
  border: 1.5px solid var(--bdr);
  overflow: hidden; transition: border-color .15s;
}
.url-bar:focus-within { border-color: var(--black); background: #fff; }
.url-bar input {
  flex: 1; min-width: 0;
  background: transparent; border: none; outline: none;
  font-family: inherit;
  font-size: 14px; font-weight: 400; color: var(--t1);
  padding: 15px 16px;
}
.url-bar input::placeholder { color: var(--t3); }
.url-bar-btn {
  background: var(--black); border: none; cursor: pointer;
  padding: 0 20px; color: #fff;
  font-family: inherit;
  font-size: 13px; font-weight: 700;
  white-space: nowrap; transition: background .15s;
  border-radius: 0 12px 12px 0;
}
.url-bar-btn:hover  { background: #222; }
.url-bar-btn:active { background: #444; transform: scale(.98); }

/* ── BUTTONS ────────────────────────────────────────────── */
.btn {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; width: 100%; border: none; cursor: pointer;
  font-family: inherit;
  font-size: 15px; font-weight: 700; letter-spacing: -.2px;
  padding: 17px 20px; border-radius: 14px;
  transition: all .13s;
}
.btn:active { transform: scale(.97); }

.btn-k    { background: var(--black); color: #fff; }
.btn-k:hover   { background: #222; }
.btn-g    { background: var(--green); color: #fff; }
.btn-g:hover   { background: #25b84e; }
.btn-r    { background: var(--red);   color: #fff; }
.btn-r:hover   { background: #e0332a; }
.btn-line { background: #fff; color: var(--t1); border: 1.5px solid var(--bdr); }
.btn-line:hover { border-color: #222; }
.btn-line-r {
  background: #fff; color: var(--red);
  border: 1.5px solid #FFCDD2; border-radius: 14px;
}
.btn-line-r:hover { background: var(--rbg); border-color: var(--red); }

.btn-sm { padding: 13px 14px; font-size: 13px; border-radius: 12px; flex: 1; }
.row2 { display: flex; gap: 8px; }

/* ── SEP ────────────────────────────────────────────────── */
.div  { border: none; border-top: 1px solid var(--bdr); margin: 14px 0; }
</style>
</head>
<body>

<div class="nav">
  <div class="nav-brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M4.5 7L8 17L12 9.5L16 17L19.5 7"
              stroke="white" stroke-width="2.3"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="brand-name">wt<span> remote</span></div>
  </div>
  <div class="pill wait" id="cpill">
    <div class="pill-dot"></div>
    <span id="ctxt">Connexion…</span>
  </div>
</div>

<!-- Loading -->
<div id="s-load" class="screen show">
  <div class="loader"></div>
  <p style="font-size:14px;color:var(--t2);font-family:Poppins,sans-serif">
    Connexion au serveur…
  </p>
</div>

<!-- Error -->
<div id="s-err" class="screen">
  <div class="err-icon">📡</div>
  <div class="err-title">Serveur introuvable</div>
  <div class="err-body">
    Lancez <strong>start_remote.bat</strong> sur le NUC et assurez-vous d'être
    sur le même réseau Wi-Fi.
  </div>
  <button class="btn btn-k" style="max-width:240px;margin-top:10px" onclick="location.reload()">
    ↺ &nbsp;Réessayer
  </button>
</div>

<!-- Control -->
<div id="s-main" class="screen">
  <div class="stack">

    <!-- Now playing -->
    <div class="card">
      <div class="card-p">
        <div class="sect-lbl">En cours d'affichage</div>
        <div class="np-top">
          <div class="np-name" id="np-n">—</div>
        </div>
        <div class="np-url" id="np-u">—</div>
        <span class="status-badge on" id="sbadge">
          <span class="sb-dot"></span>
          <span id="sbtxt">Rotation active</span>
        </span>
      </div>
    </div>

    <!-- Send URL -->
    <div class="card">
      <div class="card-p">
        <div class="sect-lbl">Afficher sur la TV</div>
        <div class="url-bar">
          <input id="urlin" type="url"
                 placeholder="https://youtube.com/watch?v=…"
                 autocomplete="off" autocorrect="off"
                 autocapitalize="off" spellcheck="false">
          <button class="url-bar-btn" onclick="sendUrl()">Envoyer</button>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="card">
      <div class="card-p">
        <div class="sect-lbl">Contrôles</div>
        <button class="btn btn-r"   id="bpause"  onclick="cmd('pause')">⏸&nbsp; Pause la rotation</button>
        <button class="btn btn-g"   id="bresume" onclick="cmd('resume')" style="display:none">▶&nbsp; Reprendre la rotation</button>
        <div class="div"></div>
        <div class="row2">
          <button class="btn btn-line btn-sm" onclick="cmd('prev')">⏮ &nbsp;Précédent</button>
          <button class="btn btn-line btn-sm" onclick="cmd('next')">Suivant&nbsp; ⏭</button>
        </div>
      </div>
    </div>

    <!-- Release -->
    <div class="card" id="card-release" style="display:none;margin-bottom:0">
      <div class="card-p">
        <button class="btn btn-line-r" id="brelease" onclick="cmd('release')">
          Libérer le contrôle
        </button>
      </div>
    </div>

  </div>
</div>

<script>
let ws = null, ip = null, port = 8765;

function boot() {
  ip   = location.hostname;
  port = parseInt(location.port) || 8765;
  connect();
}

function show(id) {
  document.querySelectorAll('.screen').forEach(el =>
    el.classList.toggle('show', el.id === id));
}

function badge(state) { // 'on' | 'off' | 'wait'
  const p = document.getElementById('cpill');
  const t = document.getElementById('ctxt');
  p.className = 'pill ' + state;
  t.textContent = state === 'on' ? 'Connecté' : state === 'off' ? 'Déconnecté' : 'Connexion…';
}

let reconnectTimer = null;

function connect() {
  clearTimeout(reconnectTimer);
  badge('wait');
  ws = new WebSocket(`ws://${ip}:${port}`);
  ws.onopen    = () => ws.send(JSON.stringify({ type: 'mobile' }));
  ws.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch(e) { return; }
    if (m.type === 'auth_ok') { show('s-main'); badge('on'); }
    if (m.type === 'state')   sync(m);
  };
  ws.onclose = () => {
    badge('off');
    if (!document.getElementById('s-main').classList.contains('show')) show('s-err');
    reconnectTimer = setTimeout(connect, 3000);
  };
  ws.onerror = () => {};
}

function sync(s) {
  const urls = s.urls || [], c = urls[s.currentIndex || 0] || {};
  const npn  = document.getElementById('np-n');
  const npu  = document.getElementById('np-u');
  const sb   = document.getElementById('sbadge');
  const sbt  = document.getElementById('sbtxt');
  const bp   = document.getElementById('bpause');
  const br   = document.getElementById('bresume');
  const crel = document.getElementById('card-release');

  if (s.remotePaused && s.remoteUrl) {
    // External URL open from remote
    npn.textContent = s.remoteUrl;
    npu.textContent = s.remoteUrl;
    sb.className = 'status-badge ext';
    sbt.textContent = 'URL externe';
    bp.style.display = 'none'; br.style.display = ''; crel.style.display = '';
  } else if (s.active) {
    npn.textContent = c.name || c.url || '—';
    npu.textContent = c.url || '—';
    sb.className = 'status-badge on';
    sbt.textContent = 'Rotation active';
    bp.style.display = ''; br.style.display = 'none'; crel.style.display = 'none';
  } else {
    npn.textContent = c.name || c.url || '—';
    npu.textContent = c.url || '—';
    sb.className = 'status-badge off';
    sbt.textContent = 'En pause';
    bp.style.display = 'none'; br.style.display = ''; crel.style.display = 'none';
  }
}

function cmd(action, extra) {
  if (ws?.readyState === 1)
    ws.send(JSON.stringify({ type: 'command', action, ...extra }));
}

function sendUrl() {
  const u = document.getElementById('urlin').value.trim();
  if (!u) return;
  cmd('open_url', { url: u });
  document.getElementById('urlin').value = '';
}

function go(url) { cmd('open_url', { url }); }

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('urlin')
    .addEventListener('keydown', e => { if (e.key === 'Enter') sendUrl(); });
});

boot();
</script>
</body>
</html>
