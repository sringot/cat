<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>wee rotate</title>
  <style>
    :root {
      --blue:       #3D80EF;
      --blue-dark:  #2563EB;
      --bg:         #1C1F2E;
      --surface:    #13151E;
      --border:     #2A2D3E;
      --text:       #E2E8F0;
      --muted:      #64748B;
      --red:        #EF4444;
      --red-dark:   #DC2626;
      --green-bg:   #0D2918;
      --green-bd:   #166534;
      --green-txt:  #4ADE80;
      --r:          8px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--surface);
      color-scheme: dark;
    }

    /* ── Header ── */
    .header {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 11px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.2px;
    }
    .logo svg { width: 24px; height: 24px; flex-shrink: 0; }
    .logo .accent { color: var(--blue); }

    .badge {
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      flex-shrink: 0;
    }
    .badge-active  { background: var(--green-bg); color: var(--green-txt); border: 1px solid var(--green-bd); }
    .badge-stopped { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }

    /* ── Progress bar ── */
    #progress-wrap { height: 3px; background: var(--border); overflow: hidden; }
    #progress-wrap.hidden { display: none; }
    #progress-bar  { height: 100%; background: var(--blue); width: 100%; }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
    }
    .tab-btn {
      padding: 9px 14px;
      background: none; border: none;
      border-bottom: 2px solid transparent;
      font-size: 12px; font-weight: 600;
      color: var(--muted); cursor: pointer;
      margin-bottom: -1px;
      transition: color .15s, border-color .15s;
    }
    .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }
    .tab-btn:hover:not(.active) { color: var(--text); }

    /* ── Tab panes ── */
    .tab-pane { display: none; padding: 12px; }
    .tab-pane.active { display: block; }

    /* ── URL list ── */
    #url-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }

    .url-row {
      display: grid;
      grid-template-columns: 18px 1fr auto;
      align-items: center;
      gap: 0 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 8px 10px;
      transition: border-color .15s;
    }
    .url-row:focus-within { border-color: var(--blue); }
    .url-row.active-url   { border-color: var(--green-bd); background: var(--green-bg); }
    .url-row.drag-over    { border-color: var(--blue); background: #1a2840; }

    .drag-handle {
      color: #3D4559; cursor: grab; font-size: 14px;
      user-select: none; align-self: center;
    }
    .drag-handle:active { cursor: grabbing; }

    .url-fields { display: flex; flex-direction: column; gap: 3px; min-width: 0; }

    .name-input {
      border: none; outline: none; background: transparent;
      font-size: 12px; font-weight: 600; color: var(--text); width: 100%;
    }
    .name-input::placeholder { color: #3D4559; font-weight: 400; }

    .url-input {
      border: none; outline: none; background: transparent;
      font-size: 11px; font-family: 'Consolas', 'Fira Mono', monospace;
      color: var(--muted); width: 100%;
    }
    .url-input::placeholder { color: #3D4559; }

    .url-actions {
      display: flex; flex-direction: column;
      align-items: flex-end; gap: 4px; flex-shrink: 0;
    }

    .btn-del {
      background: none; border: none; cursor: pointer;
      color: #3D4559; padding: 1px 2px;
      font-size: 12px; line-height: 1; border-radius: 3px;
      transition: color .15s;
    }
    .btn-del:hover { color: var(--red); }

    .url-interval-wrap { display: flex; align-items: center; gap: 2px; }
    .url-interval {
      width: 38px; border: 1px solid var(--border); border-radius: 4px;
      padding: 2px 4px; font-size: 10px; text-align: center;
      color: var(--muted); outline: none;
      background: var(--surface); transition: border-color .15s;
    }
    .url-interval:focus { border-color: var(--blue); }
    .url-interval.custom { border-color: var(--blue); color: var(--blue); font-weight: 600; }
    .interval-s { font-size: 9px; color: #3D4559; }

    /* ── Add button ── */
    .btn-add {
      width: 100%; padding: 8px;
      background: none; border: 1.5px dashed var(--border);
      border-radius: var(--r); cursor: pointer;
      color: var(--muted); font-size: 12px; font-weight: 600;
      transition: all .15s;
    }
    .btn-add:hover { border-color: var(--blue); color: var(--blue); background: #1a2840; }

    .empty-hint { text-align: center; color: #3D4559; font-size: 12px; padding: 18px 0; }

    /* ── Action buttons ── */
    .actions { display: flex; gap: 8px; margin-top: 12px; }

    .btn {
      display: flex; align-items: center; justify-content: center;
      gap: 5px; padding: 9px 16px;
      border: none; border-radius: var(--r);
      cursor: pointer; font-size: 12px; font-weight: 700;
      transition: all .15s; white-space: nowrap;
    }
    .btn-primary { background: var(--blue);  color: #fff; flex: 1; }
    .btn-primary:hover { background: var(--blue-dark); }
    .btn-danger  { background: var(--red);   color: #fff; flex: 1; }
    .btn-danger:hover  { background: var(--red-dark); }
    .btn-ghost   { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover   { background: var(--surface); border-color: #4B5563; }

    .hidden { display: none !important; }

    /* ── Setting cards ── */
    .setting-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .setting-card-title {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
      color: var(--muted); margin-bottom: 10px;
    }
    .setting-row {
      display: flex; align-items: center;
      justify-content: space-between; gap: 12px;
    }
    .setting-label { font-size: 12px; font-weight: 500; }
    .setting-desc  { font-size: 10px; color: var(--muted); margin-top: 2px; }

    .interval-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    input[type="range"] { width: 90px; accent-color: var(--blue); cursor: pointer; }
    .interval-num {
      width: 52px; padding: 4px 6px;
      border: 1px solid var(--border); border-radius: 5px;
      font-size: 12px; text-align: center; outline: none;
      background: var(--surface); color: var(--text);
      transition: border-color .15s;
    }
    .interval-num:focus { border-color: var(--blue); }
    .interval-unit { font-size: 11px; color: var(--muted); }

    /* ── Toggle switch ── */
    .toggle { position: relative; width: 36px; height: 20px; flex-shrink: 0; cursor: pointer; }
    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-track {
      position: absolute; inset: 0;
      background: var(--border); border-radius: 20px;
      transition: background .2s;
    }
    .toggle-thumb {
      position: absolute;
      width: 14px; height: 14px;
      top: 3px; left: 3px;
      background: #fff; border-radius: 50%;
      transition: transform .2s;
      pointer-events: none;
    }
    .toggle input:checked ~ .toggle-track { background: var(--blue); }
    .toggle input:checked ~ .toggle-thumb { transform: translateX(16px); }

    /* ── Schedule details ── */
    .schedule-details { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }

    .time-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; color: var(--muted);
    }
    input[type="time"] {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 5px; padding: 4px 8px;
      font-size: 12px; color: var(--text); outline: none; cursor: pointer;
      transition: border-color .15s;
    }
    input[type="time"]:focus { border-color: var(--blue); }

    .days-row { display: flex; gap: 4px; }
    .day-btn {
      width: 30px; height: 28px;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--surface); color: var(--muted);
      font-size: 10px; font-weight: 700; cursor: pointer;
      transition: all .15s;
    }
    .day-btn.on  { background: var(--blue); border-color: var(--blue); color: #fff; }
    .day-btn:hover:not(.on) { border-color: var(--blue); color: var(--blue); }

    /* ── Config actions ── */
    .config-btns { display: flex; gap: 8px; }
    .btn-cfg {
      flex: 1; padding: 7px 8px;
      border: 1px solid var(--border); border-radius: var(--r);
      background: var(--surface); color: var(--text);
      font-size: 11px; font-weight: 600; cursor: pointer;
      transition: all .15s;
    }
    .btn-cfg:hover { border-color: var(--blue); color: var(--blue); }
    .btn-cfg-danger:hover { border-color: var(--red); color: var(--red); }

    /* ── Debug ── */
    #debug-toggle {
      width: 100%; background: none;
      border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 10px; font-size: 10px; font-weight: 700;
      color: var(--muted); cursor: pointer;
      text-align: left; text-transform: uppercase; letter-spacing: 1px;
      transition: all .15s;
    }
    #debug-toggle:hover { border-color: var(--blue); color: var(--blue); }
    #debug-box {
      display: none; margin-top: 6px;
      background: #0D1117; border-radius: 6px;
      padding: 8px; max-height: 140px; overflow-y: auto;
    }
    #debug-box.open { display: block; }
    #debug-log {
      font-family: 'Consolas', monospace; font-size: 10px;
      color: #7EE787; white-space: pre-wrap; word-break: break-all;
    }
    #debug-clear {
      margin-top: 6px; font-size: 10px;
      background: none; border: none; color: var(--red); cursor: pointer; padding: 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="12" fill="#1D6FF3"/>
        <path d="M6.5 8L9.2 16L12 10.5L14.8 16L17.5 8" stroke="white" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      wee<span class="accent">rotate</span>
    </div>
    <span id="badge" class="badge badge-stopped">Arrêté</span>
  </div>

  <div id="progress-wrap" class="hidden">
    <div id="progress-bar"></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="rotation">Rotation</button>
    <button class="tab-btn" data-tab="settings">Paramètres</button>
  </div>

  <!-- Tab Rotation -->
  <div id="tab-rotation" class="tab-pane active">
    <div id="url-list"></div>
    <button id="btn-add" class="btn-add">+ Ajouter une URL</button>
    <div class="actions">
      <button id="btn-start" class="btn btn-primary">▶ Démarrer</button>
      <button id="btn-stop"  class="btn btn-danger  hidden">■ Arrêter</button>
      <button id="btn-next"  class="btn btn-ghost   hidden" title="URL suivante">⏭</button>
    </div>
  </div>

  <!-- Tab Paramètres -->
  <div id="tab-settings" class="tab-pane">

    <!-- Intervalle -->
    <div class="setting-card">
      <div class="setting-card-title">Intervalle de rotation</div>
      <div class="setting-row">
        <div>
          <div class="setting-label">Durée globale</div>
          <div class="setting-desc">Utilisée pour les URLs sans durée spécifique</div>
        </div>
        <div class="interval-controls">
          <input type="range" id="slider" min="5" max="300" step="5" value="30">
          <input type="number" id="interval" class="interval-num" min="5" max="86400" value="30">
          <span class="interval-unit">s</span>
        </div>
      </div>
    </div>

    <!-- Plages horaires -->
    <div class="setting-card">
      <div class="setting-card-title">Plages horaires</div>
      <div class="setting-row">
        <div>
          <div class="setting-label">Activation automatique</div>
          <div class="setting-desc">Démarre et arrête la rotation selon l'horaire</div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="schedule-enabled">
          <span class="toggle-track"></span>
          <span class="toggle-thumb"></span>
        </label>
      </div>
      <div id="schedule-details" class="schedule-details hidden">
        <div class="time-row">
          <span>De</span>
          <input type="time" id="schedule-start" value="08:00">
          <span>à</span>
          <input type="time" id="schedule-end" value="18:00">
        </div>
        <div class="days-row">
          <button class="day-btn" data-day="1">Lu</button>
          <button class="day-btn" data-day="2">Ma</button>
          <button class="day-btn" data-day="3">Me</button>
          <button class="day-btn" data-day="4">Je</button>
          <button class="day-btn" data-day="5">Ve</button>
          <button class="day-btn" data-day="6">Sa</button>
          <button class="day-btn" data-day="0">Di</button>
        </div>
      </div>
    </div>

    <!-- Import / Export -->
    <div class="setting-card">
      <div class="setting-card-title">Configuration</div>
      <div class="config-btns">
        <button id="btn-export" class="btn-cfg">⬇ Exporter</button>
        <button id="btn-import" class="btn-cfg">⬆ Importer</button>
        <button id="btn-reset"  class="btn-cfg btn-cfg-danger">↺ Réinitialiser</button>
      </div>
      <input type="file" id="import-file" accept=".json" class="hidden">
    </div>

    <!-- Debug -->
    <div class="setting-card">
      <div class="setting-card-title">Debug</div>
      <button id="debug-toggle">⚙ Logs background</button>
      <div id="debug-box">
        <div id="debug-log">(aucun log)</div>
        <button id="debug-clear">Effacer les logs</button>
      </div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
