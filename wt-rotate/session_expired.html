<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session expirée</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0f1117;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  font-family: system-ui, -apple-system, sans-serif;
}
.card { text-align: center; padding: 5vw; }
.icon { font-size: 8vw; margin-bottom: 2vw; }
h1 {
  font-size: 4vw;
  font-weight: 700;
  color: #f59e0b;
  margin-bottom: 1.5vw;
  letter-spacing: 0.02em;
}
.name { font-size: 3vw; color: #94a3b8; margin-bottom: 3vw; }
.status {
  font-size: 2vw;
  color: #64748b;
  animation: pulse 2s ease-in-out infinite;
}
.dots::after {
  content: '';
  animation: dots 1.5s steps(4, end) infinite;
}
@keyframes dots {
  0%  { content: ''; }
  25% { content: '.'; }
  50% { content: '..'; }
  75% { content: '...'; }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.5; }
}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔒</div>
  <h1>Session expirée</h1>
  <div class="name" id="dashName"></div>
  <div class="status">Reconnexion en cours<span class="dots"></span></div>
</div>
<script>
const p = new URLSearchParams(location.search);
const n = p.get('name');
if (n) document.getElementById('dashName').textContent = n;
</script>
</body>
</html>
